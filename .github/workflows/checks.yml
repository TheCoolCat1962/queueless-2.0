name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Run automated tests
        id: tests
        run: bun run test

      - name: Check TypeScript
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun x --no-install tsc --noEmit

      - name: Build for production
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build

      - name: Summarize required checks
        if: ${{ always() }}
        run: |
          {
            echo "## Tests, types, and build"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Frozen dependency installation | ${{ steps.install.outcome }} |"
            echo "| Automated tests | ${{ steps.tests.outcome }} |"
            echo "| TypeScript | ${{ steps.types.outcome }} |"
            echo "| Production build | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  style:
    name: Style baseline (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Report ESLint baseline
        id: eslint
        continue-on-error: true
        run: bun run lint

      - name: Report Prettier baseline
        id: prettier
        continue-on-error: true
        run: bun x --no-install prettier --check .

      - name: Summarize informational style checks
        if: ${{ always() }}
        env:
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          PRETTIER_OUTCOME: ${{ steps.prettier.outcome }}
        run: |
          {
            echo "## Style baseline (informational)"
            echo ""
            echo "These checks are non-blocking until the existing baseline is resolved."
            echo "See each step's log for affected files and diagnostics."
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| ESLint | $ESLINT_OUTCOME |"
            echo "| Prettier | $PRETTIER_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ESLINT_OUTCOME" == "failure" || "$PRETTIER_OUTCOME" == "failure" ]]; then
            echo "::warning::Existing style issues are informational; see the ESLint and Prettier logs."
          fi
